# nginx.conf
# Reverse proxy between Cloudflare Tunnel and Django (Daphne).
# Cloudflare handles HTTPS externally — only HTTP circulates here.
# Daphne is used instead of Gunicorn because the app uses WebSockets (Django Channels).
server {
    listen 80;
    server_name control.jmarroyo.es;

    client_max_body_size 10M;

    # Static files served directly by Nginx — Django does not intervene
    location /static/ {
        alias /app/staticfiles/;
    }

    # WebSocket connections require special proxy headers to upgrade the protocol
    # — without this block, Nginx would close the WebSocket connection immediately
    location /ws/ {
        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Regular HTTP traffic — Django views, HTMX requests
    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Generous timeouts — the Pi shares resources with 25+ containers
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}