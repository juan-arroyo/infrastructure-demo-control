services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      # Dev credentials loaded from .env — never hardcode credentials in source code
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    # Redis acts as the channel layer for Django Channels — required for WebSocket message routing between processes
    image: redis:7-alpine

  web:
    build: ./backend
    env_file:
      # Load environment variables from .env file — never commit .env to GitHub
      - .env
    # Wait for PostgreSQL to be ready before starting Django — prevents connection refused on startup
    command: >
      sh -c "while ! nc -z db 5432; do sleep 1; done &&
            python manage.py migrate &&
            daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    volumes:
      # Mount source code so changes reflect immediately without rebuilding the image
      - ./backend:/app
    ports:
      - "8001:8000"
    depends_on:
      - db
      - redis

volumes:
  postgres_data: